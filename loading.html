<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Model Interface</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: #0e0e0e;
      color: #e0e0e0;
    }

    /* LOADING PAGE */
    #loading {
      height: 100vh;
      width: 100vw;
      background: radial-gradient(circle at center, #121212, #0a0a0a);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      overflow: hidden;
      animation: pulseBg 3s ease-in-out infinite alternate;
    }

    @keyframes pulseBg {
      from { background-color: #0a0a0a; }
      to { background-color: #121212; }
    }

    .tech-text {
      font-size: 2rem;
      letter-spacing: 2px;
      color: #00e5ff;
      border-right: 2px solid #00e5ff;
      white-space: nowrap;
      overflow: hidden;
      width: 32ch;
      animation: typing 4s steps(32), blink .7s step-end infinite;
    }

    @keyframes typing {
      from { width: 0 }
      to { width: 32ch }
    }

    @keyframes blink {
      50% { border-color: transparent }
    }

    .loading-sub {
      margin-top: 20px;
      text-align: center;
      max-width: 600px;
      font-size: 1.1rem;
      color: #cccccc;
    }

    /* MAIN PAGE */
    #main {
      display: none;
      padding: 40px;
      max-width: 1200px;
      margin: auto;
      background: #0e0e0e;
    }

    h1 {
      color: #00e5ff;
      text-align: center;
      margin-bottom: 40px;
    }

    h2 {
      margin-bottom: 10px;
      color: #00bcd4;
    }

    .section {
      background: linear-gradient(to right, #1c1c1c, #121212);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.15);
      transition: transform 0.2s ease-in-out;
    }

    .section:hover {
      transform: translateY(-4px);
    }

    textarea {
      width: 100%;
      height: 100px;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      background: #1a1a1a;
      color: #e0e0e0;
      border: 1px solid #00e5ff30;
      font-size: 1rem;
    }

    button {
      margin-top: 12px;
      padding: 10px 24px;
      background-color: #00e5ff;
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #00bcd4;
    }

    .output {
      margin-top: 15px;
      color: #a0f0ff;
      white-space: pre-wrap;
      border-top: 1px solid #00e5ff40;
      padding-top: 10px;
    }

    @media screen and (max-width: 600px) {
      .tech-text {
        font-size: 1.2rem;
        width: 24ch;
        animation: typing 3s steps(24), blink .7s step-end infinite;
      }
    }
  </style>
</head>
<body>

  <!-- Loading Page -->
  <div id="loading">
    <div class="tech-text">Cargando sistema de inteligencia artificial...</div>
    <p class="loading-sub">
      Interfaz inteligente para procesamiento de lenguaje natural con modelos T5 de Google. Automatiza resúmenes, preguntas y traducciones.
    </p>
  </div>

  <!-- Página principal -->
  <div id="main">
    <h1>🔷 Interfaz Inteligente - Modelos de TI 🔷</h1>

    <div class="section">
      <h2>📄 Resumen</h2>
      <textarea id="resumenInput" placeholder="Escribe el texto a resumir..."></textarea>
      <button onclick="enviarTexto('resumen')">Procesar Resumen</button>
      <div class="output" id="resumenOutput"></div>
    </div>

    <div class="section">
      <h2>❓ Pregunta</h2>
      <textarea id="preguntaInput" placeholder="Escribe una pregunta sobre un texto..."></textarea>
      <button onclick="enviarTexto('pregunta')">Responder Pregunta</button>
      <div class="output" id="preguntaOutput"></div>
    </div>

    <div class="section">
      <h2>🧠 Generar Pregunta</h2>
      <textarea id="generar_preguntaInput" placeholder="Escribe un texto para generar preguntas..."></textarea>
      <button onclick="enviarTexto('generar_pregunta')">Generar Pregunta</button>
      <div class="output" id="generar_preguntaOutput"></div>
    </div>

    <div class="section">
      <h2>🌐 Traducir</h2>
      <textarea id="traducirInput" placeholder="Escribe el texto a traducir..."></textarea>
      <button onclick="enviarTexto('traducir')">Traducir</button>
      <div class="output" id="traducirOutput"></div>
    </div>
  </div>

  <script>
    // Esperar a que termine la animación de typing antes de mostrar la página principal
    window.addEventListener('load', () => {
      const textoAnimado = document.querySelector('.tech-text');
      textoAnimado.addEventListener('animationend', () => {
        setTimeout(() => {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('main').style.display = 'block';
        }, 1500); // tiempo extra después de la animación
      });
    });

    function enviarTexto(tipo) {
      const input = document.getElementById(`${tipo}Input`).value;
      if (!input.trim()) {
        alert("Por favor escribe algo primero.");
        return;
      }

      fetch(`http://localhost:5000/${tipo}`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ texto: input })
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById(`${tipo}Output`).innerText = data.resultado;
      })
      .catch(err => {
        console.error(err);
        document.getElementById(`${tipo}Output`).innerText = "Error al procesar la solicitud.";
      });
    }
  </script>

</body>
</html>
