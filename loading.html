<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modelos de TI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: #121212;
      color: #f0f0f0;
    }

    /* LOADING PAGE */
    #loading {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: #1e1e1e;
    }

    .typing {
      font-size: 1.5rem;
      width: 24ch;
      white-space: nowrap;
      overflow: hidden;
      border-right: 2px solid;
      animation: typing 4s steps(24), blink .7s step-end infinite;
    }

    @keyframes typing {
      from { width: 0 }
      to { width: 24ch }
    }

    @keyframes blink {
      50% { border-color: transparent }
    }

    /* MAIN CONTENT */
    #main {
      display: none;
      padding: 40px;
      max-width: 1200px;
      margin: auto;
    }

    h2 {
      margin-top: 30px;
      color: #00bcd4;
    }

    .section {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.1);
    }

    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      resize: none;
      background: #2a2a2a;
      color: white;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      border: none;
      background-color: #00bcd4;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #0097a7;
    }

    .output {
      margin-top: 15px;
      color: #ccc;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <!-- Loading Page -->
  <div id="loading">
    <div class="typing">Cargando modelos de TI...</div>
    <p style="margin-top: 20px; max-width: 600px; text-align: center;">
      Bienvenido al sistema de procesamiento inteligente basado en modelos T5 para tareas de procesamiento de lenguaje natural.
    </p>
  </div>

  <!-- Página principal -->
  <div id="main">
    <h1>Modelos de TI - Aplicaciones Inteligentes</h1>

    <div class="section">
      <h2>Resumen</h2>
      <textarea id="resumenInput" placeholder="Escribe el texto a resumir..."></textarea>
      <button onclick="enviarTexto('resumen')">Procesar Resumen</button>
      <div class="output" id="resumenOutput"></div>
    </div>

    <div class="section">
      <h2>Pregunta</h2>
      <textarea id="preguntaInput" placeholder="Escribe una pregunta sobre un texto..."></textarea>
      <button onclick="enviarTexto('pregunta')">Responder Pregunta</button>
      <div class="output" id="preguntaOutput"></div>
    </div>

    <div class="section">
      <h2>Generar Pregunta</h2>
      <textarea id="generar_preguntaInput" placeholder="Escribe un texto para generar preguntas..."></textarea>
      <button onclick="enviarTexto('generar_pregunta')">Generar Pregunta</button>
      <div class="output" id="generar_preguntaOutput"></div>
    </div>

    <div class="section">
      <h2>Traducir</h2>
      <textarea id="traducirInput" placeholder="Escribe el texto a traducir..."></textarea>
      <button onclick="enviarTexto('traducir')">Traducir</button>
      <div class="output" id="traducirOutput"></div>
    </div>
  </div>

  <script>
    // Simula el loading por 3 segundos
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('main').style.display = 'block';
      }, 3000);
    });

    function enviarTexto(tipo) {
      const input = document.getElementById(`${tipo}Input`).value;
      if (!input.trim()) {
        alert("Por favor escribe algo primero.");
        return;
      }

      fetch(`http://localhost:5000/${tipo}`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ texto: input })
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById(`${tipo}Output`).innerText = data.resultado;
      })
      .catch(err => {
        console.error(err);
        document.getElementById(`${tipo}Output`).innerText = "Ocurrió un error al procesar.";
      });
    }
  </script>

</body>
</html>
